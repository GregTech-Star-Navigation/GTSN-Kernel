plugins {
    id 'java-library'
    alias forge.plugins.modDevGradle
}

group = maven_group
version = "${mod_version}"

repositories {
    mavenCentral()
    maven { url = "https://maven.minecraftforge.net/" }
    if (project.hasProperty('withGtceu')) {
        // 组织 fork 的 GTCEu 发布在 GitHub Packages，读取也需要凭据（read:packages）。
        maven {
            url = uri("https://maven.pkg.github.com/GregTech-Star-Navigation/GregTech-Modern")
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
        maven { url = "https://maven.gtceu.com" }
        maven { url = "https://maven.firstdark.dev/snapshots/" }
        maven { url = "https://maven.tterrag.com/" }
        maven { url = "https://modmaven.dev" }
        maven { url = "https://maven.blamejared.com/" }
    }
}

dependencies {
    // Mixin 注解处理器：生成 SRG refmap。
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    // 可选：装上 GTCEu 用真实机器做压测。默认不引入，避免每次构建都要拉组织私有包。
    //   ./gradlew runServer -PwithGtceu
    if (project.hasProperty('withGtceu')) {
        modImplementation("com.gregtechceu.gtceu:gtceu-1.20.1:7.5.4-patch01:slim") { transitive = false }
        modImplementation("com.lowdragmc.ldlib:ldlib-forge-1.20.1:1.0.40.b") { transitive = false }
        modImplementation("com.tterrag.registrate:Registrate:MC1.20-1.3.11")
        modImplementation("dev.toma.configuration:configuration-forge-1.20.1:2.2.0")
    }
}

legacyForge {
    version = forge.versions.minecraftForge.get()

    parchment {
        minecraftVersion = forge.versions.minecraft.get()
        mappingsVersion = forge.versions.parchment.get()
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        client {
            client()
            ideName = "Client"
        }
        server {
            server()
            ideName = "Server"
            gameDirectory.set(file('run/server'))
            programArgument '--nogui'
            // 每 200 tick（10 秒）把阶段摘要写进日志：无人值守服务器看不了 /gtsnperf。
            jvmArgument '-Dgtsnkernel.perf.logEvery=200'
            jvmArgument '-Dgtsnkernel.perf.csv=true'
            // 二期 2b：-PregionEnabled 让 ServerLevel.tick 走调度器路径（串行，并行度=1）。
            // 默认关闭 = 原版 tick 路径。一致性测试靠它做两次运行对比。
            if (project.hasProperty('regionEnabled')) {
                jvmArgument '-Dgtsnkernel.region.enabled=true'
            }
            // 三期实验：方块实体 tick 按 region 并行。-PparallelBlocks[=N]
            if (project.hasProperty('parallelBlocks')) {
                jvmArgument '-Dgtsnkernel.blocks.parallel=true'
                def lanes = project.property('parallelBlocks')
                if (lanes != null && lanes.toString().isInteger()) {
                    jvmArgument "-Dgtsnkernel.blocks.parallelism=${lanes}"
                }
            }
            // 并行分区的粒度：区块坐标右移几位算一个 region（4 = 16×16 区块，1 = 2×2 区块）。
            // 测试场地跨度小时要调小，否则只有一个 region，「并行」退化成单 lane。
            if (project.hasProperty('regionShift')) {
                jvmArgument "-Dgtsnkernel.blocks.regionShift=${project.property('regionShift')}"
            }
            // P2a 白名单：只有这些类型的方块实体会被丢到 lane 并行，其余留在主线程。
            // 依据是实测（furnace 113288 次零失败 / hopper 3757 次失败）。
            if (project.hasProperty('safeTypes')) {
                jvmArgument "-Dgtsnkernel.blocks.safeTypes=${project.property('safeTypes')}"
            }
        }
    }
}

// Mixin 基础设施（照 GTSNLib 的做法）：
// refmap 由注解处理器产出到 build/mixin/，config 在 dev 运行里通过一个独立小 jar 挂到
// additionalRuntimeClasspath —— ModLauncher 的 union filesystem 只索引 classpath jar、
// 不索引目录条目，所以 dev 下 Mixin 无法通过 --mixin.config 读到 mod 自己的配置。
mixin {
    add sourceSets.main, 'mixins.gtsnkernel.refmap.json'
    config 'mixins.gtsnkernel.json'
}

def mixinConfigJar = tasks.register('mixinConfigJar', Jar) {
    archiveClassifier = 'mixins'
    destinationDirectory = layout.buildDirectory.dir('mixinjar')
    from('src/main/resources/mixins.gtsnkernel.json')
    from(layout.buildDirectory.dir('mixin')) {
        include 'mixins.gtsnkernel.refmap.json'
    }
    dependsOn tasks.named('compileJava')
}

legacyForge.runs.configureEach { run ->
    project.dependencies.add(
        run.getAdditionalRuntimeClasspathConfiguration().name,
        project.files(mixinConfigJar)
    )
    run.taskBefore(mixinConfigJar)
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs << "-Xlint:-removal"
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : 'GTSN-Kernel',
            'Specification-Vendor'  : 'GTSN',
            'Specification-Version' : '1',
            'Implementation-Title'  : 'GTSN-Kernel',
            'Implementation-Version': project.version,
            'Implementation-Vendor' : 'GTSN',
            'MixinConfigs'          : 'mixins.gtsnkernel.json'
        ])
    }
}

// ── 运行时 JDK 开关 ────────────────────────────────────────────────────────────
// 构建固定 JDK 21（Gradle 8.14 读不了 JDK 25 的 class 69）。
// 运行时可切到 25：`./gradlew runServer -Pjdk25`。
// 前置条件（未验证，二期 spike）：把 ASM 从 Forge 自带的 9.7.1 换到 9.10.1+，
// 否则 ModLauncher 读到 JDK 25 的 class 69 会抛 Unsupported class file major version 69。
if (project.hasProperty('jdk25')) {
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }
    configurations.configureEach {
        resolutionStrategy {
            force 'org.ow2.asm:asm:9.10.1'
            force 'org.ow2.asm:asm-tree:9.10.1'
            force 'org.ow2.asm:asm-analysis:9.10.1'
            force 'org.ow2.asm:asm-commons:9.10.1'
            force 'org.ow2.asm:asm-util:9.10.1'
        }
    }
}
